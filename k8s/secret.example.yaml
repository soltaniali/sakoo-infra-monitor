# Copy to secret.sops.yaml, paste PROBE_KEY from ~/infra-monitor/secrets.env on the London server,
# then encrypt with SOPS before committing:  sops -e -i secret.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sakoo-infra-probe
  namespace: aip-mlops-service
type: Opaque
stringData:
  PROBE_KEY: CHANGE-ME
