# Run:    docker compose up -d --build        Logs: docker compose logs -f
# One round, printed:  docker compose run --rm probe --print
# Ops dashboard (same container): https://85.198.48.95:8443 (self-signed certificate, team login)
services:
  probe:
    build: .
    image: sakoo-probe-station:1
    container_name: sakoo-probe-station
    restart: unless-stopped
    cap_add: [NET_ADMIN]          # create tun devices and routes, inside this container only
    devices: ["/dev/net/tun:/dev/net/tun"]
    ports: ["8443:8443"]   # ops dashboard: HTTPS (secrets/ops-tls.*) + login; limit clients with OPS_ALLOW_CIDRS in secrets/ops.env
    volumes:                      # code + config from the host: update = copy + restart
      - ./secrets:/secrets:ro
      - ./data:/data              # ops.db, ops-users.json, probe-results.json
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./probe.py:/app/probe.py:ro
      - ./probe-station.json:/app/probe-station.json:ro
      - ./ops.py:/app/ops.py:ro
      - ./ops_web.py:/app/ops_web.py:ro
      - ./ops.html:/app/ops.html:ro
      - ./ops.js:/app/ops.js:ro
      - ./tickets.py:/app/tickets.py:ro
    extra_hosts:                  # internal names, not in public DNS; reached through the cluster VPN (tun0)
      - "gitprod.aip.sharif.ir:172.30.153.10"
      - "monitoringprod.aip.sharif.ir:172.30.153.10"
      - "langfusepilot.aipsharif.ir:185.220.226.23"   # public name, but the host's DNS often fails; reached through tun1
    env_file:                     # optional integrations (litellm, GitLab, Grafana): set-ops-tokens.sh, see README
      - path: ./secrets/ops.env
        required: false
    environment:                  # the host's proxy must not be used for checks or reports
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      PROBE_CONFIG: /app/probe-station.json
      PROBE_RESULTS: /data/probe-results.json
      OPS_DATA: /data
      OPS_URL: https://85.198.48.95:8443/   # link in Telegram alerts
